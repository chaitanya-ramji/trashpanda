name: Release

# Push a tag such as v0.2.0. The workflow builds, signs, notarizes, and publishes the DMG.
# It then updates the Homebrew cask. See docs/RELEASING.md for the secrets it needs.
# The job runs only when the repository variable SIGNED_RELEASES is "true".
# Until then, releases are made by hand and are not signed.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    if: ${{ vars.SIGNED_RELEASES == 'true' }}
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          echo "RELEASE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)"/\1/')"
          echo "DEVELOPER_ID=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/TrashPanda-$VERSION.dmg" "build/TrashPanda-$VERSION.dmg.sha256" \
            --title "Trash Panda $VERSION" --generate-notes

      - name: Prove where the disk image was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/TrashPanda-*.dmg

      - name: Check out the Homebrew tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: chaitanya-ramji/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Update the Homebrew cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(cut -d' ' -f1 "build/TrashPanda-$VERSION.dmg.sha256")"
          mkdir -p tap/Casks
          ./scripts/make-cask.sh "$VERSION" "$SHA" > tap/Casks/trashpanda.rb
          cd tap
          git config user.name "chaitanya-ramji"
          git config user.email "9416558+chaitanya-ramji@users.noreply.github.com"
          git add Casks/trashpanda.rb
          git commit -m "trashpanda $VERSION"
          git push

      - name: Delete the temporary keychain
        if: always()
        run: |
          if [ -n "$RELEASE_KEYCHAIN" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
