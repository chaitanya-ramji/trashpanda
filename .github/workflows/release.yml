name: Release

# Push a tag such as v0.2.0. The workflow builds, signs, notarizes, and publishes the DMG.
# It then updates the Homebrew cask. See docs/RELEASING.md for the secrets it needs.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)"/\1/')"
          echo "DEVELOPER_ID=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/TrashPanda-$VERSION.dmg" "build/TrashPanda-$VERSION.dmg.sha256" \
            --title "Trash Panda $VERSION" --generate-notes

      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(cut -d' ' -f1 "build/TrashPanda-$VERSION.dmg.sha256")"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/chaitanya-ramji/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          ./scripts/make-cask.sh "$VERSION" "$SHA" > "$RUNNER_TEMP/tap/Casks/trashpanda.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "chaitanya-ramji"
          git config user.email "9416558+chaitanya-ramji@users.noreply.github.com"
          git add Casks/trashpanda.rb
          git commit -m "trashpanda $VERSION"
          git push
